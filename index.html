<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore SESI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🛒 TechStore SESI 💻</h1>

    <section class="formulario" id="form">

        <h3>Dados da Venda:</h3>

        <input type="text" id="inputNome" placeholder="Nome do Cliente">

        <input type="number" id="inputIdade" placeholder="Idade do Cliente">

        <input type="number" id="inputValor" placeholder="Valor total (R$)">

        <select id="inputCupom">
            <option value="false">Não possui cupom</option>
            <option value="true">Possui cupom (15% OFF)</option>
        </select>

        <select id="inputVIP">
            <option value="false">Cliente comum</option>
            <option id="opcaoVIP" value="true" disabled>
                💎 Cliente VIP
            </option>
        </select>

        <button onclick="executarSistema()">
            Finalizar Venda
        </button>

    </section>

    <section class="cadastrovip" id="cadastro" style="display:none">
        <section class="cadastrovip" id="cadastro" style="display:none">

            <h3>💎 Cadastro VIP 💎</h3>
            <input type="text" id="nomevip" placeholder="Nome">
            <input type="number" id="idadevip" placeholder="Idade">
            <input type="email" id="emailvip" placeholder="Email">
            <input type="text" id="cpfvip" placeholder="CPF">        
            <button onclick="voltarFormulario()">
                Voltar
            </button>
            <button onclick="executarCadastro()">
                Cadastrar
            </button>
        </section>
        <button onclick="voltarFormulario()">
            Voltar
        </button>

    </section>

    <hr>

    <section id="feedback">

        <p id="mensagem-autorizacao">
            Preencha os dados acima.
        </p>

        <ul id="lista-estoque"></ul>

        <div id="relatorio-final" class="card" style="display:none"></div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
